<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominic & Faith | 2026</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            overflow: hidden;
        }

        .background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.4) blur(5px);
            transition: all 2s ease-in-out;
            transform: scale(1.1);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            z-index: 2;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            letter-spacing: 2px;
            opacity: 1;
            transition: opacity 1s ease;
        }

        .year {
            font-weight: 300;
            font-size: 1.2rem;
            margin-top: 10px;
            color: #d4af37;
        }

        .revealed .background-image {
            filter: brightness(1) blur(0);
            transform: scale(1);
        }

        .revealed h1, .revealed .year {
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <img src="dominic-faith.jpg" alt="Dominic and Faith" class="background-image" id="bg">
        
        <div class="overlay">
            <h1 id="names">Dominic & Faith</h1>
            <p class="year">Bentleyville 2026</p>
        </div>
    </div>

    <script>
        const card = document.getElementById('mainCard');
        
        // This triggers the "TikTok Reveal" after 1.5 seconds
        setTimeout(() => {
            card.classList.add('revealed');
        }, 1500);

        // Or click to toggle
        card.addEventListener('click', () => {
            card.classList.toggle('revealed');
        });
    </script>
</body>
</html>
